name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PhoneAgent.xcodeproj \
            -scheme PhoneAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/PhoneAgent.app Payload/
          zip -r PhoneAgent.ipa Payload
          ls -lh PhoneAgent.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-ipa
          path: PhoneAgent.ipa
          retention-days: 30
